<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TimeTo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%231a1a1a' stroke-width='8'/><line x1='50' y1='50' x2='50' y2='20' stroke='%231a1a1a' stroke-width='6' stroke-linecap='round'/><line x1='50' y1='50' x2='70' y2='50' stroke='%231a1a1a' stroke-width='4' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-right-area">
    <div class="hitokoto" id="hitokoto"></div>
    <div class="global-time" id="globalTime"></div>
</div>

<div class="app">

<div class="nav">
    <button class="nav-btn active" data-tab="alarm" aria-label="闹钟">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
    </button>
    <button class="nav-btn" data-tab="timer" aria-label="倒计时">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
        </svg>
    </button>
    <button class="nav-btn" data-tab="stopwatch" aria-label="秒表">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M5 3L2 6"/>
            <path d="M22 6l-3-3"/>
            <path d="M12 2v2"/>
            <path d="M10 2h4"/>
        </svg>
    </button>
    <button class="nav-btn" data-tab="clock" aria-label="世界时钟">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
    </button>
</div>

<div class="content">
<div class="content-inner">

    <div class="section-title active" id="titleAlarm">ALARM</div>
    <div class="section-title" id="titleTimer">COUNTDOWN</div>
    <div class="section-title" id="titleSw">STOPWATCH</div>
    <div class="section-title" id="titleClock">WORLD CLOCK</div>

    <div class="mode-container">

    <div id="alarmMode" class="mode active">
        <div class="picker-area">
            <div class="time-column" id="aHourCol">
                <div class="highlight-indicator"></div>
                <div class="scroll-wrapper" id="aHourWrap"></div>
            </div>
            <div class="separator">:</div>
            <div class="time-column" id="aMinCol">
                <div class="highlight-indicator"></div>
                <div class="scroll-wrapper" id="aMinWrap"></div>
            </div>
        </div>
        <div class="alarm-status" id="alarmStatus"></div>
        <div class="btn-row">
            <button class="btn-set" id="btnSet">设置闹钟</button>
            <button class="btn-cancel" id="btnCancel" style="display:none;">取消</button>
        </div>
    </div>

    <div id="timerMode" class="mode timer-mode">
        <div id="timerPicker" class="timer-picker">
            <div class="picker-area">
                <div class="time-column" id="tHourCol">
                    <div class="highlight-indicator"></div>
                    <div class="scroll-wrapper" id="tHourWrap"></div>
                </div>
                <div class="separator">:</div>
                <div class="time-column" id="tMinCol">
                    <div class="highlight-indicator"></div>
                    <div class="scroll-wrapper" id="tMinWrap"></div>
                </div>
                <div class="separator">:</div>
                <div class="time-column" id="tSecCol">
                    <div class="highlight-indicator"></div>
                    <div class="scroll-wrapper" id="tSecWrap"></div>
                </div>
            </div>
            <div style="margin-top:56px; text-align:center">
                <div class="btn-row" style="justify-content:center">
                    <button class="btn-set" id="btnStart">开始倒计时</button>
                    <button class="btn-cancel" id="btnTimerReset">重置</button>
                </div>
            </div>
        </div>
        <div id="countdownMode" class="countdown-mode">
            <div class="countdown-time" id="countdownTime">
                <span id="cdHour">00</span><span class="colon">:</span><span id="cdMinute">00</span><span class="colon">:</span><span id="cdSecond">00</span>
            </div>
            <div class="countdown-controls">
                <button class="btn-pause" id="btnPause">
                    <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                    <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="btn-stop" id="btnStop">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="stopwatchMode" class="mode">
        <div class="sw-display" id="swDisplay">00:00.00</div>
        <div class="sw-controls">
            <button class="btn-sw-lap" id="btnLap" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                    <line x1="4" y1="22" x2="4" y2="15"/>
                </svg>
            </button>
            <button class="btn-sw-start" id="btnSwStart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button class="btn-sw-reset" id="btnSwReset" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
            </button>
        </div>
        <div class="lap-list" id="lapList"></div>
    </div>

    <div id="clockMode" class="mode">
        <div class="clock-list" id="clockList"></div>
    </div>

    </div>

</div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
